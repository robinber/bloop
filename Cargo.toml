[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
block2 = "0.6.2"
bloop-audio = { path = "crates/bloop-audio" }
bloop-core = { path = "crates/bloop-core" }
bloop-macos = { path = "crates/bloop-macos" }
bloop-providers = { path = "crates/bloop-providers" }
coreaudio-rs = "0.14.2"
cpal = { version = "0.18.2", default-features = false }
dispatch2 = "0.3.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1", "http2"] }
hyper-tls = { version = "0.6.0", features = ["alpn"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "http2", "tokio"] }
native-tls = { version = "0.2.18", features = ["alpn"] }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSButton", "NSColor", "NSControl", "NSEvent", "NSFont", "NSGraphics", "NSImage", "NSMenu", "NSMenuItem", "NSPanel", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSRunningApplication", "NSScreen", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWindow", "NSWorkspace", "libc", "objc2-core-foundation", "objc2-core-text", "objc2-quartz-core"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFMachPort", "CFRunLoop"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColor", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "CTFont"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSEnumerator", "NSNotification", "NSOperation", "NSString", "NSURL", "block2"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CAGradientLayer", "CALayer", "CATextLayer", "CATransaction", "CATransform3D", "objc2-core-foundation", "objc2-core-graphics"] }
rtrb = "0.4.1"
rubato = { version = "5.0.1", default-features = false, features = ["fft_resampler"] }
secrecy = "0.10.3"
security-framework = { version = "3.7.0", default-features = false }
security-framework-sys = { version = "2.17.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time", "macros"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "native-tls"] }
toml = { version = "1.2.0", default-features = false, features = ["parse", "serde"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
raw_borrows_via_references = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

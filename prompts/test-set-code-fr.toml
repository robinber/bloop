# French technical test set of the correction, for the `code` prompt.
#
# Each sample is a raw transcript, as a realtime speech model writes it for a developer who talks
# to a coding agent or a terminal. All texts are invented. They contain no private data.
# The note tells the reviewer what to check. The tool does not send it to the model.
# The samples with `validation = true` are reserved for the check after a prompt change.
# The evaluation tool runs them only with `--validation`.
# The sample words differ from the examples of `prompts/code.md`, so a copied example shows.
#
# Categories: the categories of the evaluation tool. The id gives the technical case.

[[sample]]
id = "file-name-01"
category = "technical"
raw = "ouvre le fichier settings point rs et regarde le champ max underscore retries dans la struct Config"
note = "Expected settings.rs and max_retries. Keep struct Config. Do not open anything or describe the file."

[[sample]]
id = "path-01"
category = "technical"
raw = "le bug est dans crates slash bloop tiret core slash src slash session point rs vers la ligne 240 quand la génération change"
note = "Expected crates/bloop-core/src/session.rs. Keep 240 in digits. The rest stays the French of the speaker."

[[sample]]
id = "flag-01"
category = "technical"
raw = "relance cargo build tiret tiret release tiret tiret locked et dis-moi s'il reste des warnings"
note = "Expected cargo build --release --locked. Keep warnings in English. Do not answer or report warnings."

[[sample]]
id = "version-01"
category = "number"
raw = "on passe le projet en Python trois point treize et on garde Django en 5 point 1 pour l'instant"
note = "Expected Python 3.13 and Django en 5.1. Keep pour l'instant."

[[sample]]
id = "casing-01"
category = "name"
raw = "j'ai poussé le fix sur github et la ci tourne maintenant sur mac os et sur ubuntu avec la dernière version de rust"
note = "Expected GitHub, CI, macOS, Ubuntu, and Rust. Keep fix in English. No other change."


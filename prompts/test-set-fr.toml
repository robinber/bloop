# French test set of the correction.
#
# Each sample is a raw transcript, as a realtime speech model writes it for an informal speaker.
# All texts are invented. They contain no private data.
# The note tells the reviewer what to check. The tool does not send it to the model.
# The samples with `validation = true` are reserved for the check after a prompt change.
# The evaluation tool runs them only with `--validation`.
# The correction does not apply the dictionary pairs.
#
# Categories: question, negation, number, name, technical, spoken-correction, hesitation,
# instruction, long, punctuation, dictionary-fits, dictionary-does-not-fit.

[[dictionary]]
written = "mi amor"
heard = "Mia Moore"

[[dictionary]]
written = "tokio"
heard = "Tokyo"

[[dictionary]]
written = "Vercel"
heard = "Versailles"


[[sample]]
id = "long-01"
category = "long"
raw = """\
  alors petit point sur le projet euh on a fini la migration de la base de données la semaine \
  dernière et tout s'est bien passé à part un souci avec les index qui a ralenti les requêtes \
  pendant 2 jours maintenant c'est réglé par contre le module d'export est pas encore prêt parce \
  que le client a changé le format au dernier moment donc je propose qu'on décale la livraison au \
  28 et qu'on fasse une démo intermédiaire jeudi pour montrer ce qui marche déjà euh dis-moi si ça \
  te va et si tu veux que j'envoie un récap à toute l'équipe"""
note = "A long message without punctuation. Natural sentences, not one sentence for each clause. Keep 2 jours and 28."

[[sample]]
id = "long-02"
category = "long"
raw = """\
  Ok alors voilà ce que je veux. Quand l'enregistrement commence, tu joues un petit son, et quand \
  il s'arrête tu en joues un autre, un peu plus grave. Euh le son doit pas bloquer le thread \
  principal hein, sinon l'orbe va ramer. Tu mets le réglage dans le menu avec une case à cocher, \
  désactivée par défaut, et tu ajoutes des tests pour le modèle du menu. Ensuite tu mets à jour la \
  doc dans le fichier structure et dans le fichier des contrats. Si un truc te paraît pas clair tu \
  t'arrêtes et tu me demandes avant de continuer, je préfère ça plutôt que tu inventes."""
note = "Long instructions to a coding agent. Do not do the task. Keep tu, the negations, and the order."

[[sample]]
id = "long-03"
category = "long"
raw = """\
  Bon. Je t'explique pour ce week-end. On part samedi matin vers 8 heures. parce que sinon il y a \
  trop de monde sur l'autoroute. et on s'arrête manger. chez mes parents à Orléans. Ensuite on \
  repart. vers 15 heures pour arriver au chalet avant la nuit. Si tu peux prendre les chaînes. pour \
  la voiture ce serait top. parce qu'ils annoncent de la neige. dimanche. Et euh pense aussi à. tes \
  chaussures de rando. on fera peut-être la balade du lac si il fait beau. Dis-moi si ça te va."""
note = "Wrong periods inside the sentences. Join the parts of each sentence. Keep si il as dictated."
validation = true

